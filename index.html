<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oxford 3000 Flashcards PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // เปิดใช้ Dark Mode แบบ Manual Toggle
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        thai: ['Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 select-none font-sans transition-colors duration-300">

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 z-10 sticky top-0 transition-colors duration-300">
        <div class="max-w-md mx-auto flex flex-col gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-md">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                
                <div class="flex-1 relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search..." autocomplete="off"
                        class="w-full pl-10 pr-4 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white border-none rounded-full focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-400 text-sm">
                </div>

                <!-- Settings Button -->
                <button id="settingsBtn" class="p-2 text-gray-500 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>

            <!-- Category Bar -->
            <div class="flex gap-2 overflow-x-auto pb-1" id="categoryList">
                <!-- JS populates buttons -->
            </div>
            
            <!-- Counters -->
             <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 px-1">
                <span>Card: <span id="currentIndex" class="font-bold">0</span>/<span id="totalCards">0</span></span>
                <span class="text-green-600 dark:text-green-400">Learned: <span id="learnedCount">0</span></span>
            </div>
        </div>
    </header>

    <!-- MAIN AREA -->
    <main class="flex-1 flex flex-col justify-center items-center p-4 relative w-full max-w-md mx-auto touch-manipulation">
        
        <!-- Messages -->
        <div id="msgContainer" class="hidden absolute flex-col items-center justify-center text-center z-0">
            <i id="msgIcon" class="fa-solid fa-check-circle text-5xl text-green-500 mb-3"></i>
            <p id="msgText" class="text-gray-500 dark:text-gray-400 text-lg font-thai">All words learned!</p>
            <button id="resetLearnedBtn" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-full text-sm shadow-lg hover:bg-blue-700 hidden">
                Reset Progress
            </button>
        </div>

        <!-- CARD CONTAINER -->
        <div class="w-full aspect-[4/5] max-h-[60vh] perspective-1000 cursor-pointer group z-10" id="cardContainer">
            <div class="flashcard-inner bg-white dark:bg-gray-800 relative w-full h-full shadow-xl rounded-3xl transition-all duration-500 transform-style-3d" id="cardInner">
                
                <!-- FRONT -->
                <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col justify-between p-8 rounded-3xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-start">
                        <span id="cardLevel" class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 text-xs px-2 py-1 rounded-full font-bold uppercase">--</span>
                        <div class="flex gap-2">
                             <!-- Mark as Learned Button -->
                            <button id="markLearnedBtn" class="text-gray-300 hover:text-green-500 transition-colors p-2" title="Mark as Learned">
                                <i class="fa-regular fa-circle-check text-2xl"></i>
                            </button>
                            <button id="speakBtnFront" class="text-gray-400 hover:text-blue-500 transition-colors p-2 active:scale-95">
                                <i class="fa-solid fa-volume-high text-2xl"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <h1 id="cardWord" class="text-5xl font-bold text-gray-800 dark:text-white mb-2 tracking-tight break-words">Word</h1>
                        <p id="cardIpa" class="text-xl text-gray-400 font-mono">/ipa/</p>
                        <span id="cardPos" class="inline-block mt-3 text-sm text-blue-600 dark:text-blue-400 font-semibold bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full">pos</span>
                    </div>

                    <div class="text-center text-gray-400 text-sm animate-pulse">
                        Tap to flip <i class="fa-solid fa-arrow-rotate-right ml-1"></i>
                    </div>
                </div>

                <!-- BACK -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col justify-between p-8 rounded-3xl bg-slate-50 dark:bg-gray-750 dark:bg-slate-800 border border-slate-200 dark:border-gray-700">
                    <div>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="w-2 h-8 bg-blue-500 rounded-full"></span>
                            <h2 class="text-xl font-bold text-gray-700 dark:text-gray-200 font-thai">ความหมาย</h2>
                        </div>
                        
                        <p id="cardThai" class="text-3xl text-gray-800 dark:text-white font-thai mb-6 leading-relaxed">คำแปล</p>
                        
                        <div class="bg-white dark:bg-gray-700 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-600">
                            <p class="text-xs text-gray-400 uppercase font-bold mb-2 tracking-wider">Example</p>
                            <p id="cardExample" class="text-lg text-gray-700 dark:text-gray-200 italic mb-2">"..."</p>
                            <p id="cardExampleMeaning" class="text-sm text-gray-500 dark:text-gray-400 font-thai">"..."</p>
                        </div>
                    </div>

                    <div class="flex justify-center mt-4">
                         <button id="speakBtnBack" class="flex items-center gap-2 bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-4 py-2 rounded-full hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors shadow-sm">
                            <i class="fa-solid fa-volume-high"></i> Listen again
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER CONTROLS -->
    <footer class="p-6 pb-8 bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 max-w-md mx-auto w-full z-10 transition-colors duration-300">
        <div class="flex justify-between items-center gap-4">
            <button id="prevBtn" class="w-14 h-14 rounded-full border-2 border-gray-200 dark:border-gray-600 text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center transition-all active:scale-90">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
            
            <!-- Main Action Button (Quiz Mode) -->
            <button id="quizModeBtn" class="flex-1 h-14 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full shadow-lg shadow-blue-200 dark:shadow-none flex items-center justify-center gap-2 font-bold hover:from-blue-700 hover:to-indigo-700 transition-all active:scale-95">
                <i class="fa-solid fa-graduation-cap"></i> Quiz Mode
            </button>
            
            <button id="nextBtn" class="w-14 h-14 rounded-full border-2 border-gray-200 dark:border-gray-600 text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center transition-all active:scale-90">
                <i class="fa-solid fa-arrow-right text-lg"></i>
            </button>
        </div>
    </footer>

    <!-- MODALS (Hidden by default) -->

    <!-- 1. Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-6 transform translate-y-full sm:translate-y-0 transition-transform duration-300">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold dark:text-white">Settings</h2>
                <button id="closeSettings" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <div class="space-y-4">
                <!-- Dark Mode Toggle -->
                <div class="flex justify-between items-center">
                    <span class="dark:text-gray-200"><i class="fa-solid fa-moon mr-2"></i> Dark Mode</span>
                    <button id="toggleDark" class="w-12 h-6 bg-gray-200 dark:bg-blue-600 rounded-full relative transition-colors">
                        <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform dark:translate-x-6"></span>
                    </button>
                </div>
                <!-- Auto Audio Toggle -->
                <div class="flex justify-between items-center">
                    <span class="dark:text-gray-200"><i class="fa-solid fa-volume-high mr-2"></i> Auto-play Audio</span>
                    <button id="toggleAudio" class="w-12 h-6 bg-gray-200 rounded-full relative transition-colors">
                        <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
                    </button>
                </div>
                 <!-- Reset Progress -->
                 <hr class="border-gray-100 dark:border-gray-700">
                 <button id="resetProgressBtn" class="w-full py-3 text-red-500 font-semibold hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors">
                    <i class="fa-solid fa-trash-can mr-2"></i> Reset Learned Words
                 </button>
            </div>
        </div>
    </div>

    <!-- 2. Quiz Modal -->
    <div id="quizModal" class="fixed inset-0 bg-white dark:bg-gray-900 hidden z-50 flex flex-col">
        <div class="p-4 flex justify-between items-center border-b dark:border-gray-700">
            <button id="closeQuiz" class="text-gray-500 dark:text-gray-300"><i class="fa-solid fa-arrow-left text-xl"></i> Back</button>
            <span class="font-bold text-blue-600 dark:text-blue-400">Quiz Mode</span>
            <span id="quizScore" class="font-mono bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded">Score: 0</span>
        </div>
        
        <div class="flex-1 flex flex-col justify-center items-center p-6 max-w-md mx-auto w-full">
            <div class="mb-8 text-center">
                <span class="text-sm text-gray-400 uppercase tracking-wide">What is the meaning of?</span>
                <h2 id="quizWord" class="text-4xl font-bold text-gray-800 dark:text-white mt-2 mb-4">Word</h2>
                <button id="quizSpeakBtn" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-volume-high text-2xl"></i></button>
            </div>
            
            <div id="quizOptions" class="grid grid-cols-1 gap-3 w-full">
                <!-- Options injected by JS -->
            </div>
            
            <div id="quizFeedback" class="mt-6 h-8 text-center font-bold"></div>
        </div>
        
        <div class="p-6 pb-8 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-center">
             <button id="quizNextBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl shadow-lg font-bold hover:bg-blue-700 transition-colors hidden">
                Next Question
            </button>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW fail', err));
            });
        }
    </script>
</body>
</html>
