<div id="quizModal" class="fixed inset-0 bg-white dark:bg-gray-900 hidden z-50 flex flex-col">
        <div class="p-4 flex justify-between items-center border-b dark:border-gray-700">
            <button id="closeQuiz" class="text-gray-500 dark:text-gray-300"><i class="fa-solid fa-arrow-left text-xl"></i> Back</button>
            <span class="font-bold text-blue-600 dark:text-blue-400">Quiz Mode</span>
            <span id="quizScore" class="font-mono bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 px-2 py-1 rounded">Score: 0</span>
        </div>
        
        <div class="flex-1 flex flex-col justify-center items-center p-6 max-w-md mx-auto w-full">
            <div class="mb-8 text-center">
                <span class="text-[10px] text-gray-400 uppercase font-black tracking-widest">Meaning of?</span>
                <h2 id="quizWord" class="text-4xl font-bold text-gray-800 dark:text-white mt-2 mb-4">Word</h2>
                <button id="quizSpeakBtn" class="text-blue-500 hover:text-blue-600"><i class="fa-solid fa-volume-high text-2xl"></i></button>
            </div>
            
            <div id="quizOptions" class="grid grid-cols-1 gap-3 w-full"></div>
            
            <div id="quizInputContainer" class="hidden w-full flex flex-col gap-3">
                <input type="text" id="quizInput" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-800 dark:text-white border-2 border-transparent focus:border-blue-500 rounded-xl outline-none text-center text-xl font-bold" placeholder="Type the English word..." autocomplete="off" autocorrect="off" autocapitalize="none">
                <button id="quizSubmitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl shadow font-bold hover:bg-blue-700 transition-colors">Submit</button>
            </div>
            
            <div id="quizFeedback" class="mt-6 h-8 text-center font-bold"></div>
        </div>
        
        <div class="p-6 pb-8 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-center">
             <button id="quizNextBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl shadow-lg font-bold hover:bg-blue-700 transition-colors hidden">
                Next Question
            </button>
        </div>
    </div>
