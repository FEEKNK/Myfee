<div id="view-finance" class="flex-1 flex flex-col hidden w-full h-full pb-28">
        <header class="bg-white dark:bg-gray-800 shadow-sm p-4 z-20">
            <div class="max-w-md mx-auto flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <button onclick="switchTab('home')" class="text-gray-400 hover:text-rose-500 transition-colors p-2">
                        <i class="fa-solid fa-arrow-left text-2xl"></i>
                    </button>
                    <h2 class="text-xl font-bold dark:text-white font-thai">กระเป๋าเงิน (Finance)</h2>
                    <div class="w-10"></div>
                </div>

                <!-- Timeframe Period Selector Tabs -->
                <div class="flex gap-2 bg-gray-100 dark:bg-gray-700 p-1 rounded-xl font-thai text-xs">
                    <button onclick="changeFinPeriod('month'); this.parentElement.querySelectorAll('button').forEach(b=>b.className='flex-1 py-1.5 rounded-lg text-gray-500 dark:text-gray-400'); this.className='flex-1 py-1.5 rounded-lg bg-white dark:bg-gray-800 font-bold text-rose-600 dark:text-rose-400 shadow-sm';" class="flex-1 py-1.5 rounded-lg bg-white dark:bg-gray-800 font-bold text-rose-600 dark:text-rose-400 shadow-sm">
                        📅 สรุปรายเดือน
                    </button>
                    <button onclick="changeFinPeriod('year'); this.parentElement.querySelectorAll('button').forEach(b=>b.className='flex-1 py-1.5 rounded-lg text-gray-500 dark:text-gray-400'); this.className='flex-1 py-1.5 rounded-lg bg-white dark:bg-gray-800 font-bold text-rose-600 dark:text-rose-400 shadow-sm';" class="flex-1 py-1.5 rounded-lg text-gray-500 dark:text-gray-400">
                        📆 สรุปรายปี
                    </button>
                    <button onclick="changeFinPeriod('all'); this.parentElement.querySelectorAll('button').forEach(b=>b.className='flex-1 py-1.5 rounded-lg text-gray-500 dark:text-gray-400'); this.className='flex-1 py-1.5 rounded-lg bg-white dark:bg-gray-800 font-bold text-rose-600 dark:text-rose-400 shadow-sm';" class="flex-1 py-1.5 rounded-lg text-gray-500 dark:text-gray-400">
                        ♾️ ทั้งหมด
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full space-y-4">
            <!-- Period Navigator -->
            <div class="flex items-center justify-between bg-white dark:bg-gray-800 px-4 py-2 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                <button onclick="prevFinPeriod()" class="p-2 text-gray-400 hover:text-rose-500 transition-colors">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>
                <span id="finPeriodLabel" class="font-bold text-gray-800 dark:text-gray-100 font-thai text-sm">กรกฎาคม 2569</span>
                <button onclick="nextFinPeriod()" class="p-2 text-gray-400 hover:text-rose-500 transition-colors">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>
            </div>

            <!-- Search, Filter & Export -->
            <div class="flex gap-2">
                <div class="flex-1 relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="finSearchInput" oninput="renderFinance()" placeholder="ค้นหารายการ..." class="w-full pl-8 pr-3 py-2 bg-white dark:bg-gray-800 dark:text-white border border-gray-100 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-rose-500 focus:outline-none transition-all placeholder-gray-400 font-thai text-xs shadow-sm">
                </div>
                <select id="finFilterCat" onchange="renderFinance()" class="px-2 py-2 bg-white dark:bg-gray-800 dark:text-white border border-gray-100 dark:border-gray-700 rounded-xl text-xs font-thai font-bold focus:outline-none shadow-sm text-gray-600 dark:text-gray-300">
                    <option value="All">ทุกหมวดหมู่</option>
                    <option value="อาหาร">🍔 อาหาร</option>
                    <option value="เดินทาง">🚕 เดินทาง</option>
                    <option value="ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
                    <option value="บันเทิง">🎬 บันเทิง</option>
                    <option value="บิลต่างๆ">🧾 บิลต่างๆ</option>
                    <option value="เงินเดือน">💰 เงินเดือน</option>
                    <option value="อื่นๆ">📦 อื่นๆ</option>
                </select>
                <button onclick="exportFinanceCSV()" class="px-3 py-2 bg-green-500 text-white rounded-xl shadow-sm hover:bg-green-600 transition-all text-xs font-bold" title="ส่งออก CSV">
                    <i class="fa-solid fa-file-csv"></i>
                </button>
            </div>

            <!-- Balance Card -->
            <div class="bg-gradient-to-r from-rose-500 to-pink-600 text-white p-5 rounded-3xl shadow-xl">
                <span class="text-xs font-bold opacity-80 uppercase tracking-wider font-thai">ยอดเงินคงเหลือสุทธิ (ช่วงเวลานี้)</span>
                <h1 id="netBalance" class="text-4xl font-black mt-1">฿0</h1>
                
                <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-white/20">
                    <div>
                        <span class="text-xs opacity-75 font-thai">รายรับรวม</span>
                        <p id="totalIncome" class="text-lg font-bold text-emerald-200">+฿0</p>
                    </div>
                    <div>
                        <span class="text-xs opacity-75 font-thai">รายจ่ายรวม</span>
                        <p id="totalExpense" class="text-lg font-bold text-rose-200">-฿0</p>
                    </div>
                </div>
            </div>

            <!-- Category Breakdown Widget -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                <h3 class="font-bold text-xs uppercase tracking-wider text-gray-400 font-thai flex items-center justify-between">
                    <span>📊 สรุปรายจ่ายแยกตามหมวดหมู่</span>
                </h3>
                <div id="finCategoryBreakdown" class="space-y-2.5"></div>
            </div>

            <!-- Add / Edit Transaction Form -->
            <form id="financeForm" onsubmit="event.preventDefault(); addTransaction(document.getElementById('finType').value, document.getElementById('finCat').value, document.getElementById('finAmount').value, document.getElementById('finNote').value, document.getElementById('finDate').value); document.getElementById('finAmount').value=''; document.getElementById('finNote').value='';" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                <h3 class="font-bold text-sm text-gray-700 dark:text-gray-300 font-thai flex flex-wrap justify-between items-center gap-2">
                    <span id="finFormTitle">เพิ่มรายการใหม่</span>
                    <input type="date" id="finDate" required class="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-lg text-xs font-thai focus:outline-none cursor-pointer">
                </h3>
                <div class="grid grid-cols-2 gap-2">
                    <select id="finType" class="px-3 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl text-sm font-thai focus:outline-none">
                        <option value="expense">🔴 รายจ่าย (Expense)</option>
                        <option value="income">🟢 รายรับ (Income)</option>
                    </select>
                    <select id="finCat" class="px-3 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl text-sm font-thai focus:outline-none">
                        <option value="อาหาร">🍔 อาหาร</option>
                        <option value="เดินทาง">🚗 เดินทาง</option>
                        <option value="ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
                        <option value="ความบันเทิง">🎬 ความบันเทิง</option>
                        <option value="เงินเดือน/รายได้">💰 รายได้</option>
                        <option value="อื่นๆ">📌 อื่นๆ</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <input type="number" id="finAmount" placeholder="จำนวนเงิน (บาท)..." step="any" required class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl text-sm font-thai focus:outline-none">
                    <input type="text" id="finNote" placeholder="บันทึกย่อ..." class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white rounded-xl text-sm font-thai focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button type="button" id="finCancelBtn" onclick="cancelEditTransaction()" class="hidden flex-1 py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold rounded-xl font-thai text-sm">
                        ยกเลิก
                    </button>
                    <button type="submit" id="finSubmitBtn" class="flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-md transition-all font-thai text-sm">
                        + บันทึกรายการ
                    </button>
                </div>
            </form>
            <script>
                // ตั้งค่าเริ่มต้นของวันที่เป็นวันปัจจุบัน
                document.getElementById('finDate').value = new Date().toISOString().split('T')[0];
            </script>

            <!-- Transaction List -->
            <div class="space-y-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-gray-400 font-thai">ประวัติรายการ</h3>
                <div id="financeList" class="space-y-2"></div>
            </div>
        </main>
    </div>
